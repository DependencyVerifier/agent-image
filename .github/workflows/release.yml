name: Release

# A tag `vX.Y.Z` of this repository (the version of an agent release) publishes ghcr.io/dependencyverifier/agent:X.Y.Z
# and :latest, for amd64 and arm64, from the signed binaries of that agent release (Dockerfile.release verifies them),
# then signs the image with cosign, keyless (GitHub OIDC): `cosign verify ghcr.io/dependencyverifier/agent:X.Y.Z
# --certificate-identity-regexp '^https://github.com/DependencyVerifier/agent-image/' --certificate-oidc-issuer
# https://token.actions.githubusercontent.com`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dependencyverifier/agent

jobs:
  release:
    name: Build, push and sign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push (amd64, arm64)
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker buildx build -f Dockerfile.release \
            --platform linux/amd64,linux/arm64 \
            --build-arg AGENT_VERSION="${version}" \
            --tag "${IMAGE}:${version}" --tag "${IMAGE}:latest" \
            --provenance=mode=max --sbom=true \
            --metadata-file metadata.json \
            --push .
          digest="$(python3 -c 'import json; print(json.load(open("metadata.json"))["containerimage.digest"])')"
          echo "DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Sign with cosign (keyless)
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Smoke test
        run: docker run --rm "${IMAGE}@${DIGEST}" version | tee /dev/stderr | grep -qx "depverify-agent ${VERSION}"
