name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Dockerfile and Compose example
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.release

      - name: Validate the Compose example
        run: |
          touch .agent_token
          docker compose -f compose.example.yaml config --quiet

  build:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The image builds the agent from DependencyVerifier/agent. While that repository is private, a
      # read-only token (secret AGENT_REPO_TOKEN, fine-grained, Contents: read on agent) is needed to
      # check it out; without it the build is skipped. Once agent is public, no token is needed.
      - name: Locate the agent sources
        id: source
        env:
          AGENT_REPO_TOKEN: ${{ secrets.AGENT_REPO_TOKEN }}
        run: |
          if [ -n "$AGENT_REPO_TOKEN" ]; then
            echo "mode=checkout" >> "$GITHUB_OUTPUT"
          elif [ "$(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/DependencyVerifier/agent)" = "200" ]; then
            echo "mode=public" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::notice::DependencyVerifier/agent is private and AGENT_REPO_TOKEN is not set: image build skipped."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.source.outputs.mode == 'checkout'
        with:
          repository: DependencyVerifier/agent
          token: ${{ secrets.AGENT_REPO_TOKEN }}
          path: agent-src
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.source.outputs.mode != 'skip'

      - name: Build from the checked-out agent
        if: steps.source.outputs.mode == 'checkout'
        run: docker buildx build --build-context agent-src=./agent-src --load -t depverify-agent:ci .

      - name: Build from the public agent repository
        if: steps.source.outputs.mode == 'public'
        run: docker buildx build --load -t depverify-agent:ci .

      - name: Smoke test
        if: steps.source.outputs.mode != 'skip'
        run: docker run --rm depverify-agent:ci version
